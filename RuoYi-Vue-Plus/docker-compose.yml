# ============================================================
# 极简部署：只跑 ruoyi-admin（后端）+ art-design-pro（前端）
# MySQL / Redis 是已有外部服务（application-prod.yml 里配的
# mysql.tx.bestuav.cn:13306 / redis.tx.bestuav.cn:16379），不在这里。
# 对外直接用房名 + 端口访问，无需 Nginx 反代。
# ============================================================

services:
  # ---------------- 后端 ----------------
  backend:
    # 镜像在开发机/CI 构建好后再传到服务器，服务器上不需要源码
    image: ruoyi-backend:1.0
    # 如果想让 compose 直接构建（需要服务器上有源码），取消下面注释：
    # build:
    #   context: ./ruoyi-admin        # ruoyi-admin/Dockerfile 以该目录为上下文
    container_name: ruoyi-backend
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 18000              # 容器内端口，与下方映射一致
      # 允许前端域名跨域（端口要带上，因为不是 80/443）
      ART_CORS_ALLOWED_ORIGINS: "https://adminui.tx.bestuav.cn:18880,http://adminui.tx.bestuav.cn:18880"
      ART_WS_ALLOWED_ORIGINS: "https://adminui.tx.bestuav.cn:18880,http://adminui.tx.bestuav.cn:18880"
    ports:
      - "18000:18000"                  # 宿主机:容器，对外即 admin.tx.bestuav.cn:18000
    restart: unless-stopped

  # ---------------- 前端 ----------------
  frontend:
    image: ruoyi-frontend:1.0
    # build:
    #   context: ../art-design-pro     # 前端在同级目录 art-design-pro 里
    container_name: ruoyi-frontend
    environment:
      # 运行时注入后端地址：前端 nginx 把 /prod-api 反代到这里
      # 用同机 compose 服务名，内部转发，不走公网（更稳）
      BACKEND_API: "http://ruoyi-backend:18000"
    ports:
      - "18880:80"                     # 对外即 adminui.tx.bestuav.cn:18880
    restart: unless-stopped
