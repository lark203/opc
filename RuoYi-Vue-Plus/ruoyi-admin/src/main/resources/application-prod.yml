--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /ruoyi/server/temp

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: @monitor.username@
  password: @monitor.password@

--- # 跨域安全配置(生产)
# 仅允许指定前端域名，禁止使用通配符 *。
# 生产部署请通过环境变量 ART_CORS_ALLOWED_ORIGINS 注入真实前端域名(逗号分隔，例如 https://admin.example.com)，
# 未配置时默认仅允许 http://localhost(占位值，等同于不对外开放跨站访问)。
web:
  cors:
    allow-credentials: true
    allowed-origin-patterns: ${ART_CORS_ALLOWED_ORIGINS:http://localhost}
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - clientid
      - X-Requested-With
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    max-age: 1800

--- # 消息推送 WebSocket 跨域(生产)
# 仅允许指定前端域名，禁止使用通配符 *。
# 生产部署请通过环境变量 ART_WS_ALLOWED_ORIGINS 注入真实前端域名(逗号分隔)，
# 未配置时默认仅允许 http://localhost(占位值，等同于不对外开放跨站)。
message:
  allowed-origins: ${ART_WS_ALLOWED_ORIGINS:http://localhost}

--- # snail-job 配置
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config`表
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 127.0.0.1
    port: 17888
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # snail-ai 配置
snail-ai:
  # 启用客户端模式
  enabled: false
  # ==================== Server 连接 ====================
  # Server 端 gRPC 地址（即 snail-ai-starter 的 snail-ai.server.grpc-port）
  server:
    host: 127.0.0.1
    port: 18888
  # ==================== 客户端配置 ====================
  # 本客户端 gRPC 端口（Server 通过此端口分发 Chat 请求）
  # 应用 ID（在 Server「应用管理」页面创建后获取）
  app-id: 1
  # 认证令牌（在 Server「应用管理」页面创建时自动生成）
  token: SAI_566a6bfbc26e4998b4841cc927d50c5d
  port: 3${server.port}
  # Skill 文件临时目录
  skill-temp-dir: /tmp/snail-ai-agent/skills
  # ==================== Chat 嵌入模式配置 ====================
  chat.ui.embed:
    # 启用嵌入模式
    enabled: true
    # 嵌入模式下隐藏顶部栏
    show-header: false
    # 嵌入模式下隐藏侧边栏用户信息
    show-sidebar-user: false
    # 嵌入模式下隐藏智能体市场入口
    show-agent-market: true
    # 嵌入模式下使用紧凑输入框
    compact-input: true
    # 是否锁定当前智能体
    lock-agent: false
  # ==================== OpenAPI Client 配置 ====================
  open-api:
    # 启用 OpenAPI Client
    enabled: true
    # Server HTTP 端口
    web-port: 8900
    # 是否使用 HTTPS
    https: false
    # API 路径前缀
    prefix: snail-ai
    # 超时配置（毫秒）
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    chat-timeout-ms: 300000

--- # MyBatis Plus 配置
mybatis-plus:
  sql-log:
    # 完整 SQL 输出开关
    enabled: false
    # 输出方式，可选 console、log
    output: console

--- # 数据源配置
